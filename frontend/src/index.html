<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Policy Management</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      // Keep the key in sync with ThemeService (STORAGE_KEY).
      try {
        var t = localStorage.getItem('pms-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.style.colorScheme = t;
          document.documentElement.classList.toggle('dark-theme', t === 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
